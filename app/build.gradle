plugins { id 'com.android.application' }
android {
 namespace 'studio.mises.countdown'
 compileSdk 35
 defaultConfig { applicationId 'studio.mises.countdown'; minSdk 26; targetSdk 35; versionCode 13; versionName '0.4.4' }
 def signingStore = System.getenv('MICOUNTDOWN_SIGNING_STORE')
 if (signingStore != null) {
  // Use the existing signing certificate so installed versions can be upgraded.
  signingConfigs.debug.storeFile = file(signingStore)
  buildTypes.release.signingConfig = signingConfigs.debug
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
