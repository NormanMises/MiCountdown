plugins { id 'com.android.application' }
android {
 namespace 'studio.mises.countdown'
 compileSdk 35
 defaultConfig { applicationId 'studio.mises.countdown'; minSdk 26; targetSdk 35; versionCode 6; versionName '0.2.4' }
 def signingStore = System.getenv('MICOUNTDOWN_SIGNING_STORE')
 if (signingStore != null) {
  signingConfigs.debug.storeFile = file(signingStore)
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
